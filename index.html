<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTFW Role Randomizer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #ff4757;
            margin-top: 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .subtitle {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: -10px;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: #2d2d2d;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            padding: 10px;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .beast-select-container {
            margin-bottom: 20px;
        }
        select {
            width: 100%;
            padding: 10px;
            background-color: #2d2d2d;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff4757;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
        }
        button:hover {
            background-color: #ff6b81;
        }
        .results {
            margin-top: 25px;
            border-top: 2px solid #2d2d2d;
            padding-top: 20px;
        }
        .result-item {
            background-color: #252525;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #444;
        }
        .result-item.beast {
            border-left-color: #ff4757;
            background-color: #2a1b1d;
        }
        .result-item.guardian {
            border-left-color: #2ed573;
            background-color: #1b2a20;
        }
        .result-item.sidekick {
            border-left-color: #ffa502;
            background-color: #2a231b;
        }
        .player-name {
            font-weight: bold;
            color: #fff;
        }
        .role-name {
            float: right;
            font-weight: bold;
            color: #ffa502;
        }
        .beast .role-name {
            color: #ff4757;
        }
        .client-info {
            margin-top: 5px;
            font-size: 13px;
            color: #a4b0be;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>FTFW Randomizer</h1>
    <div class="subtitle">Flee The Facility Wild • by grillycakez/grillacc</div>

    <label for="playersInput">Enter Players (One per line):</label>
    <textarea id="playersInput" placeholder="grillycakez&#10;ria&#10;cormeto&#10;lyre&#10;rares" oninput="updateBeastDropdown()"></textarea>

    <div class="beast-select-container">
        <label for="beastSelect">Select Who is the Beast:</label>
        <select id="beastSelect">
            <option value="">-- Type players above first --</option>
        </select>
    </div>

    <button onclick="randomizeRoles()">Generate Roles</button>

    <div id="resultsContainer" class="results" style="display: none;"></div>
</div>

<script>
    const BEAST_ROLES = ["Bounty Hunter", "Jackal", "Runner", "Stalker", "Seer"];
    const BASE_SURVIVORS = ["Hacker", "Medic"];

    function updateBeastDropdown() {
        const input = document.getElementById('playersInput').value;
        const beastSelect = document.getElementById('beastSelect');
        const currentSelection = beastSelect.value;
        
        const players = input.split('\n').map(p => p.trim()).filter(p => p.length > 0);
        beastSelect.innerHTML = '';
        
        if (players.length === 0) {
            beastSelect.innerHTML = '<option value="">-- Type players above first --</option>';
            return;
        }

        players.forEach(player => {
            const option = document.createElement('option');
            option.value = player;
            option.textContent = player;
            if (player === currentSelection) option.selected = true;
            beastSelect.appendChild(option);
        });
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function randomizeRoles() {
        const input = document.getElementById('playersInput').value;
        const chosenBeast = document.getElementById('beastSelect').value;
        const resultsContainer = document.getElementById('resultsContainer');

        let survivorsList = input.split('\n').map(p => p.trim()).filter(p => p.length > 0 && p !== chosenBeast);

        if (!chosenBeast) {
            alert("Please input players and choose who the Beast is first!");
            return;
        }

        // 1. Assign Beast Role
        let shuffledBeastDeck = shuffle([...BEAST_ROLES]);
        const assignedBeastRole = shuffledBeastDeck[0];

        let htmlOutput = `
            <div class="result-item beast">
                <span class="player-name">@${chosenBeast}</span>
                <span class="role-name">${assignedBeastRole} (Beast)</span>
            </div>
        `;

        // Create player allocation slots
        let assignedPlayers = survivorsList.map(name => ({ name: name, role: "" }));
        shuffle(assignedPlayers); // Shuffle players to keep assignments random

        let currentSlot = 0;

        // RULE: If Beast is Jackal, force 1 guaranteed Sidekick slot
        if (assignedBeastRole === "Jackal" && assignedPlayers.length > 0) {
            assignedPlayers[currentSlot].role = "Sidekick";
            currentSlot++;
        }

        // RULE: Guardian chance (not guaranteed)
        if (currentSlot < assignedPlayers.length && Math.random() < 0.5) {
            assignedPlayers[currentSlot].role = "Guardian";
            currentSlot++;
        }

        // RULE: Engineer chance (not guaranteed)
        let hasEngineer = false;
        if (currentSlot < assignedPlayers.length && Math.random() < 0.5) {
            assignedPlayers[currentSlot].role = "Engineer";
            hasEngineer = true;
            currentSlot++;
        }

        // RULE: Fill the rest with repeating Hacker/Medic roles. 
        // If there was no engineer, force at least 2 Hackers total into the empty pools if possible.
        let forcedHackersCount = (!hasEngineer) ? 2 : 0;

        for (let i = currentSlot; i < assignedPlayers.length; i++) {
            if (forcedHackersCount > 0) {
                assignedPlayers[i].role = "Hacker";
                forcedHackersCount--;
            } else {
                assignedPlayers[i].role = BASE_SURVIVORS[Math.floor(Math.random() * BASE_SURVIVORS.length)];
            }
        }

        // Put players back in original input order so it's clean to read
        const orderMap = {};
        survivorsList.forEach((name, index) => orderMap[name] = index);
        assignedPlayers.sort((a, b) => orderMap[a.name] - orderMap[b.name]);

        // Render everything to HTML
        assignedPlayers.forEach(player => {
            let extraClass = "";
            if (player.role === "Guardian") extraClass = "guardian";
            if (player.role === "Sidekick") extraClass = "sidekick";

            htmlOutput += `
                <div class="result-item ${extraClass}">
                    <span class="player-name">@${player.name}</span>
                    <span class="role-name">${player.role}</span>
            `;

            // Handle Guardian's client target display logic
            if (player.role === "Guardian") {
                const validClients = survivorsList.filter(p => p !== player.name);
                if (validClients.length > 0) {
                    const randomClient = validClients[Math.floor(Math.random() * validClients.length)];
                    htmlOutput += `<div class="client-info">client = @${randomClient}</div>`;
                } else {
                    htmlOutput += `<div class="client-info">client = None</div>`;
                }
            }

            htmlOutput += `</div>`;
        });

        resultsContainer.innerHTML = htmlOutput;
        resultsContainer.style.display = 'block';
    }
</script>

</body>
</html>
